[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-pdf-editor"
version = "0.1.0"
description = "A small desktop app for adding text and simple shapes to PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.23",
    "PySide6>=6.6",
]

[project.scripts]
simple-pdf-editor = "simple_pdf_editor.__main__:main"

[tool.setuptools.packages.find]
include = ["simple_pdf_editor*"]
